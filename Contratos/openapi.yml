openapi: 3.1.0

info:
  title: API M5 - Solicitud y Despacho
  description: API del Grupo 13 para registrar solicitudes de viaje.
  version: 0.1.0

paths:
  /solicitudes:
    post:
      summary: Crear una solicitud de viaje
      description: Registra una nueva solicitud con estado PENDIENTE.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cliente_id
                - origen_latitud
                - origen_longitud
                - destino_latitud
                - destino_longitud
                - tipo_vehiculo
              properties:
                cliente_id:
                  type: string
                  format: uuid
                origen_latitud:
                  type: number
                  minimum: -90
                  maximum: 90
                origen_longitud:
                  type: number
                  minimum: -180
                  maximum: 180
                destino_latitud:
                  type: number
                  minimum: -90
                  maximum: 90
                destino_longitud:
                  type: number
                  minimum: -180
                  maximum: 180
                tipo_vehiculo:
                  type: string
                  enum:
                    - AUTO
                    - MOTO
                  description: Tipo de vehículo solicitado.

      responses:
        "201":
          description: Solicitud creada correctamente
          content:
            application/json:
              schema:
                type: object
                required:
                  - mensaje
                  - solicitud_id
                  - estado
                properties:
                  mensaje:
                    type: string
                  solicitud_id:
                    type: string
                    format: uuid
                  estado:
                    type: string
                    enum:
                      - PENDIENTE

        "422":
          description: Error de validación de los datos enviados
          content:
            application/json:
              schema:
                type: object
                required:
                  - detail
                properties:
                  detail:
                    type: array
                    items:
                      type: object
                      required:
                        - loc
                        - msg
                        - type
                      properties:
                        loc:
                          type: array
                          items:
                            type:
                              - string
                              - integer
                        msg:
                          type: string
                        type:
                          type: string
                        input:
                          description: Valor recibido que produjo el error
  /ofertas/:
    post:
      summary: Crear oferta con expiracion (RF 5.4)
      description: Registra una nueva oferta enviada a un conductor asignando una fecha de expiracion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id_solicitud
                - conductor_id
                - tiempo_expiracion_seg
              properties:
                id_solicitud:
                  type: string
                  format: uuid
                  description: ID de la solicitud asociada
                conductor_id:
                  type: string
                  format: uuid
                  description: ID del conductor destinatario
                tiempo_expiracion_seg:
                  type: integer
                  minimum: 1
                  default: 30
                  description: Tiempo en segundos para que la oferta expire
      responses:
        "201":
          description: Oferta creada con exito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Oferta"
        "422":
          description: Error de validacion en los datos enviados
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: array
                    items:
                      type: object

  /ofertas/{id_oferta}/respuesta:
    patch:
      summary: Aceptar o rechazar una oferta de conductor (RF 5.5)
      description: >
        Permite al cliente dueño de la solicitud aceptar o rechazar una oferta
        PENDIENTE de un conductor. Al aceptar, la solicitud pasa a ACEPTADA.
        Al rechazar, la solicitud vuelve a PENDIENTE para nueva asignación.
        En ambos casos se registra el cambio en el historial de despacho.
      parameters:
        - name: id_oferta
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID único de la oferta a responder

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cliente_id
                - accion
              properties:
                cliente_id:
                  type: string
                  format: uuid
                  description: ID del cliente dueño de la solicitud
                accion:
                  type: string
                  enum:
                    - ACEPTAR
                    - RECHAZAR
                  description: Acción a tomar sobre la oferta

      responses:
        "200":
          description: Oferta respondida correctamente
          content:
            application/json:
              schema:
                type: object
                required:
                  - id_oferta
                  - id_solicitud
                  - estado_oferta
                  - estado_solicitud
                  - mensaje
                properties:
                  id_oferta:
                    type: string
                    format: uuid
                  id_solicitud:
                    type: string
                    format: uuid
                  estado_oferta:
                    type: string
                    enum:
                      - ACEPTADA
                      - RECHAZADA
                  estado_solicitud:
                    type: string
                    enum:
                      - ACEPTADA
                      - PENDIENTE
                  mensaje:
                    type: string

        "403":
          description: El cliente no es el dueño de la solicitud asociada
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string

        "404":
          description: Oferta o solicitud no encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string

        "409":
          description: La oferta ya fue respondida anteriormente
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string

        "422":
          description: Error de validación de los datos enviados
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: array
                    items:
                      type: object
                      properties:
                        loc:
                          type: array
                          items:
                            type:
                              - string
                              - integer
                        msg:
                          type: string
                        type:
                          type: string
  /solicitudes/{solicitud_id}/sin-conductor:
    post:
      summary: Informar que no hay conductores disponibles (RF-5.8)
      description: >
        Marca la solicitud como SIN_CONDUCTOR cuando no hay candidatos adecuados
        o cuando venció el período de búsqueda. Solo aplica a solicitudes en
        estado PENDIENTE. Las ofertas pendientes de la solicitud pasan a EXPIRADA
        y el cambio queda registrado en el historial de despacho. La operación es
        idempotente: repetirla no duplica efectos.

      parameters:
        - name: solicitud_id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                motivo:
                  type: string
                  enum:
                    - SIN_CANDIDATOS
                    - BUSQUEDA_VENCIDA
                  default: SIN_CANDIDATOS
                  description: Causa por la cual no se consiguió conductor.

      responses:
        "200":
          description: Solicitud marcada como sin conductor (o ya lo estaba)
          content:
            application/json:
              schema:
                type: object
                required:
                  - solicitud_id
                  - estado
                  - motivo
                  - mensaje
                  - ya_registrada
                properties:
                  solicitud_id:
                    type: string
                    format: uuid
                  estado:
                    type: string
                    enum:
                      - SIN_CONDUCTOR
                  motivo:
                    type: string
                    enum:
                      - SIN_CANDIDATOS
                      - BUSQUEDA_VENCIDA
                  mensaje:
                    type: string
                  ya_registrada:
                    type: boolean
                    description: true si la solicitud ya estaba en SIN_CONDUCTOR.

        "404":
          description: La solicitud no fue encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string

        "409":
          description: La solicitud ya no está pendiente (por ejemplo, fue aceptada o cancelada)
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string

        "422":
          description: Error de validación de los datos enviados
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: array
                    items:
                      type: object
                      properties:
                        loc:
                          type: array
                          items:
                            type:
                              - string
                              - integer
                        msg:
                          type: string
                        type:
                          type: string

  /solicitudes/vencer-busquedas:
    post:
      summary: Vencer las búsquedas que superaron el plazo (RF-5.8)
      description: >
        Marca como SIN_CONDUCTOR todas las solicitudes PENDIENTE cuyo período de
        búsqueda venció. La duración del plazo se configura con la variable de
        entorno BUSQUEDA_TIMEOUT_SEG (por defecto 120 segundos).

      responses:
        "200":
          description: Resultado del barrido de vencimientos
          content:
            application/json:
              schema:
                type: object
                required:
                  - timeout_seg
                  - cantidad
                  - solicitudes
                properties:
                  timeout_seg:
                    type: integer
                    description: Plazo de búsqueda aplicado, en segundos.
                  cantidad:
                    type: integer
                    description: Cantidad de solicitudes marcadas en esta ejecución.
                  solicitudes:
                    type: array
                    items:
                      type: string
                      format: uuid
components:
  schemas:
    Oferta:
      type: object
      description: Entidad de oferta enviada a un conductor.
      required:
        - id_oferta
        - id_solicitud
        - conductor_id
        - fecha_envio
        - fecha_expiracion
        - estado
      properties:
        id_oferta:
          type: string
          format: uuid
          description: Identificador único de la oferta (UUID)
        id_solicitud:
          type: string
          format: uuid
          description: Identificador de la solicitud vinculada
        conductor_id:
          type: string
          format: uuid
          description: Identificador del conductor ofertado
        fecha_envio:
          type: string
          format: date-time
          description: Timestamp de creación y envío
        fecha_expiracion:
          type: string
          format: date-time
          description: Timestamp límite para aceptar la oferta
        estado:
          type: string
          enum:
            - PENDIENTE
            - ACEPTADA
            - RECHAZADA
            - EXPIRADA
          description: Estado del ciclo de vida de la oferta

    HistorialDespacho:
      type: object
      description: Entidad para el registro de cambios de estado del viaje.
      required:
        - id_historial
        - id_solicitud
        - estado_nuevo
        - fecha_cambio
      properties:
        id_historial:
          type: string
          format: uuid
          description: Identificador único del evento de historial
        id_solicitud:
          type: string
          format: uuid
          description: Identificador de la solicitud asociada
        estado_anterior:
          type:
            - string
            - "null"
          description: Estado previo de la solicitud (nulo si es la creación inicial)
        estado_nuevo:
          type: string
          description: Nuevo estado que adquiere la solicitud
        fecha_cambio:
          type: string
          format: date-time
          description: Timestamp del evento de cambio
