
openapi: 3.1.0

info:
  title: API M5 - Solicitud y Despacho
  description: API del Grupo 13 para registrar solicitudes de viaje.
  version: 0.1.0

paths:
  /solicitudes:
    post:
      summary: Crear una solicitud de viaje
      description: Registra una nueva solicitud con estado PENDIENTE.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cliente_id
                - origen_latitud
                - origen_longitud
                - destino_latitud
                - destino_longitud
                - tipo_vehiculo
              properties:
                cliente_id:
                  type: string
                  format: uuid
                origen_latitud:
                  type: number
                  minimum: -90
                  maximum: 90
                origen_longitud:
                  type: number
                  minimum: -180
                  maximum: 180
                destino_latitud:
                  type: number
                  minimum: -90
                  maximum: 90
                destino_longitud:
                  type: number
                  minimum: -180
                  maximum: 180
                tipo_vehiculo:
                  type: string
                  enum:
                  - AUTO
                  - MOTO
                  description: Tipo de vehículo solicitado.

      responses:
        '201':
          description: Solicitud creada correctamente
          content:
            application/json:
              schema:
                type: object
                required:
                  - mensaje
                  - solicitud_id
                  - estado
                properties:
                  mensaje:
                    type: string
                  solicitud_id:
                    type: string
                    format: uuid
                  estado:
                    type: string
                    enum:
                      - PENDIENTE

        '422':
          description: Error de validación de los datos enviados
          content:
            application/json:
              schema:
                type: object
                required:
                  - detail
                properties:
                  detail:
                    type: array
                    items:
                      type: object
                      required:
                        - loc
                        - msg
                        - type
                      properties:
                        loc:
                          type: array
                          items:
                            type:
                              - string
                              - integer
                        msg:
                          type: string
                        type:
                          type: string
                        input:
                          description: Valor recibido que produjo el error

  /ofertas/{id_oferta}/respuesta:
    patch:
      summary: Aceptar o rechazar una oferta de conductor (RF 5.5)
      description: >
        Permite al cliente dueño de la solicitud aceptar o rechazar una oferta
        PENDIENTE de un conductor. Al aceptar, la solicitud pasa a ACEPTADA.
        Al rechazar, la solicitud vuelve a PENDIENTE para nueva asignación.
        En ambos casos se registra el cambio en el historial de despacho.
      parameters:
        - name: id_oferta
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID único de la oferta a responder

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cliente_id
                - accion
              properties:
                cliente_id:
                  type: string
                  format: uuid
                  description: ID del cliente dueño de la solicitud
                accion:
                  type: string
                  enum:
                    - ACEPTAR
                    - RECHAZAR
                  description: Acción a tomar sobre la oferta

      responses:
        '200':
          description: Oferta respondida correctamente
          content:
            application/json:
              schema:
                type: object
                required:
                  - id_oferta
                  - id_solicitud
                  - estado_oferta
                  - estado_solicitud
                  - mensaje
                properties:
                  id_oferta:
                    type: string
                    format: uuid
                  id_solicitud:
                    type: string
                    format: uuid
                  estado_oferta:
                    type: string
                    enum:
                      - ACEPTADA
                      - RECHAZADA
                  estado_solicitud:
                    type: string
                    enum:
                      - ACEPTADA
                      - PENDIENTE
                  mensaje:
                    type: string

        '403':
          description: El cliente no es el dueño de la solicitud asociada
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string

        '404':
          description: Oferta o solicitud no encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string

        '409':
          description: La oferta ya fue respondida anteriormente
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string

        '422':
          description: Error de validación de los datos enviados
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: array
                    items:
                      type: object
                      properties:
                        loc:
                          type: array
                          items:
                            type:
                              - string
                              - integer
                        msg:
                          type: string
                        type:
                          type: string
