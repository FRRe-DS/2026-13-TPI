# CI de M5 (Solicitud y Despacho) - implementación G13 (Python / FastAPI)
#
# Aporte del equipo DevOps (Grupo 5). La estructura y los nombres de los jobs
# son los mismos en G04 y G13; solo cambia el setup de cada stack.
#
#   build      instala dependencias y verifica que la app carga
#   unit-tests pytest (SQLite, como hoy) con reporte JUnit en el resumen
#   e2e        app + MySQL real + mocks de M1, M2, M4 y M8 (WireMock), flujo con k6
#   sast       CodeQL + Quality Gate (bloquean alertas altas y críticas)
#   secrets    gitleaks sobre el árbol actual y los commits nuevos
#   docker     build de la imagen (sin publicar)
#
# Detalle y decisiones: devops/README.md

name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  M5_IMPL: G13
  PYTHON_VERSION: "3.10" # la misma versión que el Dockerfile
  K6_VERSION: "2.4.0"
  WIREMOCK_IMAGE: wiremock/wiremock:3.13.2
  GITLEAKS_VERSION: "8.30.1"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Compilar
        run: python -m compileall -q app crear_tablas.py

      - name: Verificar que la app carga
        run: python -c "import app.main; print('app.main OK:', app.main.app.title)"

  unit-tests:
    name: unit-tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Tests unitarios (pytest)
        run: pytest -q --junitxml=reports/junit-unit.xml

      - name: Resumen de tests
        if: ${{ !cancelled() }}
        run: python devops/ci/junit_summary.py reports/junit-unit.xml "Tests unitarios (pytest) - ${{ env.M5_IMPL }}"

      - name: Guardar reporte JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-unit-${{ env.M5_IMPL }}
          path: reports/junit-unit.xml
          if-no-files-found: warn

  e2e:
    name: e2e
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        # Credenciales descartables: la base existe solo durante este job.
        env:
          MYSQL_ROOT_PASSWORD: root_ci
          MYSQL_DATABASE: m5_db
          MYSQL_USER: m5_user
          MYSQL_PASSWORD: m5_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: m5_user
      MYSQL_PASSWORD: m5_ci
      MYSQL_DATABASE: m5_db
      # Todos los módulos dependientes los atiende el mismo WireMock (por ruta).
      MOCKS_URL: http://127.0.0.1:8089
      KEYCLOAK_ISSUER: http://127.0.0.1:8089/realms/ds-2026-realm
      KEYCLOAK_AUDIENCE: grupo-13
      KEYCLOAK_CLIENT_ID: grupo-13
      KEYCLOAK_CLIENT_SECRET: descartable-ci # el mock no lo valida
      M2_URL: http://127.0.0.1:8089
      M4_URL: http://127.0.0.1:8089      # estimación de ruta (RF-5.1)
      M4_BASE_URL: http://127.0.0.1:8089 # búsqueda de candidatos (RF-5.3)
      M4_TIMEOUT_SEG: "2"
      M7_URL: http://127.0.0.1:8089
      M8_URL: http://127.0.0.1:8089
      BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Levantar mocks de M1, M2, M4 y M8 (WireMock, según los contratos oficiales)
        run: |
          docker run -d --name mocks -p 8089:8080 \
            -v "$PWD/devops/mocks:/home/wiremock:ro" \
            "$WIREMOCK_IMAGE"
          timeout 60 bash -c 'until curl -fsS "$MOCKS_URL/__admin/mappings" >/dev/null; do sleep 1; done'
          curl -fsS "$MOCKS_URL/__admin/mappings" | python -c "import json,sys; print(len(json.load(sys.stdin)['mappings']), 'mappings cargados')"

      - name: Clave y tokens de prueba de M1 (reemplazo de Keycloak)
        run: python devops/ci/m1_tokens_prueba.py --mock "$MOCKS_URL" >> "$GITHUB_ENV"

      - name: Crear tablas en MySQL
        run: python crear_tablas.py

      - name: Levantar M5
        run: |
          mkdir -p reports
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > reports/m5.log 2>&1 &
          timeout 60 bash -c 'until curl -fsS "$BASE_URL/health/ready" >/dev/null; do sleep 1; done'

      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: ${{ env.K6_VERSION }}

      - name: E2E con k6
        run: k6 run --summary-export=reports/k6-e2e-summary.json devops/k6/e2e.js

      - name: Logs de M5 y de los mocks
        if: ${{ failure() }}
        run: |
          echo "::group::M5"; cat reports/m5.log; echo "::endgroup::"
          echo "::group::Mocks"; docker logs mocks; echo "::endgroup::"
          echo "::group::Requests sin mapping en los mocks"
          curl -fsS "$MOCKS_URL/__admin/requests/unmatched" || true
          echo "::endgroup::"

      - name: Guardar reportes E2E
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ env.M5_IMPL }}
          path: reports/
          if-no-files-found: warn

  sast:
    name: sast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # subir los resultados a Code scanning
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
          queries: security-extended

      - name: Analizar con CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:python
          output: sarif-results

      - name: Quality Gate (bloquean alertas altas y críticas)
        run: python devops/ci/sarif_gate.py sarif-results --umbral 7.0

      - name: Guardar SARIF
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif-${{ env.M5_IMPL }}
          path: sarif-results/
          if-no-files-found: warn

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Buscar secretos en el árbol actual
        run: gitleaks dir . --redact --no-banner -v

      - name: Buscar secretos en los commits nuevos
        env:
          EVENTO: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ANTES: ${{ github.event.before }}
          DESPUES: ${{ github.sha }}
        run: |
          RANGO=""
          if [ "$EVENTO" = "pull_request" ]; then
            RANGO="$BASE_SHA..$HEAD_SHA"
          elif [ "$EVENTO" = "push" ] && [ -n "$ANTES" ] && [ "$ANTES" != "0000000000000000000000000000000000000000" ]; then
            RANGO="$ANTES..$DESPUES"
          fi
          if [ -n "$RANGO" ]; then
            echo "Commits analizados: $RANGO"
            gitleaks git . --redact --no-banner -v --log-opts="$RANGO"
          else
            echo "Ejecución manual: se analiza todo el historial"
            gitleaks git . --redact --no-banner -v
          fi

  docker:
    name: docker
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build de la imagen (sin publicar)
        run: |
          docker build \
            --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            -t "m5-g13:${{ github.sha }}" .
          docker image ls m5-g13
